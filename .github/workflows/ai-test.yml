name: Test IA identification
on:
  workflow_dispatch:
  push:
    branches: [claude/pokemon-cards-marketplace-wiwxqw]
    paths: ['.github/scripts/test-ai.mjs', '.github/workflows/ai-test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/scripts/test-ai.mjs
