name: Test reconnaissance navigateur
on:
  workflow_dispatch:
  push:
    branches: [claude/pokemon-cards-marketplace-wiwxqw]
    paths: ['.github/scripts/test-recog.mjs', 'table-des-doubles/recog.js', '.github/workflows/recog-test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save --no-package-lock playwright@1.48 && npx playwright install --with-deps chromium
      - run: node .github/scripts/test-recog.mjs
